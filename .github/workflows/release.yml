name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing (non-main branches always dry-run)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    # Only run on merged PRs (not closed without merge) or manual trigger
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          persist-credentials: false

      - name: Select release mode
        env:
          PUBLISH_RELEASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run) }}
        run: |
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            echo "Publishing release from main" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: building and packaging the selected branch without publishing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Generate version
        id: version
        run: |
          # Format: YYYYMMDD.HHMMSS.0-sha.COMMITSHA (matches SI convention)
          VERSION=$(date -u +%Y%m%d.%H%M%S).0-sha.$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build dashboard
        working-directory: packages/dashboard
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Linux x86_64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-unknown-linux-gnu \
            --output dist/swamp-linux-x86_64

          # Linux aarch64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target aarch64-unknown-linux-gnu \
            --output dist/swamp-linux-aarch64

          # macOS x86_64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-apple-darwin \
            --output dist/swamp-darwin-x86_64

          # macOS aarch64 (Apple Silicon)
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target aarch64-apple-darwin \
            --output dist/swamp-darwin-aarch64

          # Windows x86_64 (cross-compiled, packaged as .zip)
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-pc-windows-msvc \
            --output /tmp/swamp.exe
          cp /tmp/swamp.exe dist/swamp-windows-x86_64
          (cd /tmp && zip -j "$GITHUB_WORKSPACE/dist/swamp-windows-x86_64.zip" swamp.exe)
          rm /tmp/swamp.exe

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum swamp-linux-x86_64 swamp-linux-aarch64 swamp-darwin-x86_64 swamp-darwin-aarch64 swamp-windows-x86_64.zip > checksums.txt
          cat checksums.txt

      - name: Authenticate to Google Cloud
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # Service-account JSON key with object create/read access to the
          # swamp-club-artifacts bucket. Stable promotion runs in swamp-uat.
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)

      - name: Package release artifacts and optionally upload to GCS
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GCS_BUCKET: swamp-club-artifacts
          DRY_RUN: ${{ !((github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)) }}
        run: bash scripts/upload_release_artifacts.sh "$RELEASE_VERSION"

      - name: Generate release body
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Write changelog section
          echo "## What's Changed" > /tmp/release_body.md
          echo "" >> /tmp/release_body.md

          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '* %s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" >> /tmp/release_body.md
            if [ -n "$PR_BODY" ]; then
              echo "" >> /tmp/release_body.md
              printenv PR_BODY >> /tmp/release_body.md
            fi
          else
            git log -1 --pretty="* %s" HEAD >> /tmp/release_body.md
            COMMIT_BODY=$(git log -1 --pretty=%b HEAD)
            if [ -n "$COMMIT_BODY" ]; then
              echo "" >> /tmp/release_body.md
              echo "$COMMIT_BODY" >> /tmp/release_body.md
            fi
          fi

          # Write installation section
          {
            echo ""
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "**macOS (Apple Silicon):**"
            echo '```bash'
            echo "curl -L https://github.com/${REPO}/releases/download/v${VERSION}/swamp-darwin-aarch64 -o swamp"
            echo 'chmod +x swamp && sudo mv swamp /usr/local/bin/'
            echo '```'
            echo ""
            echo "**macOS (Intel):**"
            echo '```bash'
            echo "curl -L https://github.com/${REPO}/releases/download/v${VERSION}/swamp-darwin-x86_64 -o swamp"
            echo 'chmod +x swamp && sudo mv swamp /usr/local/bin/'
            echo '```'
            echo ""
            echo "**Linux (x86_64):**"
            echo '```bash'
            echo "curl -L https://github.com/${REPO}/releases/download/v${VERSION}/swamp-linux-x86_64 -o swamp"
            echo 'chmod +x swamp && sudo mv swamp /usr/local/bin/'
            echo '```'
            echo ""
            echo "**Linux (aarch64):**"
            echo '```bash'
            echo "curl -L https://github.com/${REPO}/releases/download/v${VERSION}/swamp-linux-aarch64 -o swamp"
            echo 'chmod +x swamp && sudo mv swamp /usr/local/bin/'
            echo '```'
            echo ""
            echo "**Windows (x86_64):**"
            echo 'Run PowerShell as Administrator. Invoke swamp by its full path below, or add C:\Program Files\swamp to PATH.'
            echo '```powershell'
            echo "Invoke-WebRequest -Uri https://github.com/${REPO}/releases/download/v${VERSION}/swamp-windows-x86_64.zip -OutFile swamp.zip"
            printf '%s\n' "New-Item -ItemType Directory -Force -Path 'C:\Program Files\swamp' | Out-Null"
            printf '%s\n' "Expand-Archive swamp.zip -DestinationPath .; Move-Item swamp.exe 'C:\Program Files\swamp\'"
            printf '%s\n' "& 'C:\Program Files\swamp\swamp.exe' --version"
            echo '```'
          } >> /tmp/release_body.md

          cp /tmp/release_body.md dist/release_body.md

      - name: Stage GitHub Release assets
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/release_body.md
            dist/swamp-linux-x86_64
            dist/swamp-linux-aarch64
            dist/swamp-darwin-x86_64
            dist/swamp-darwin-aarch64
            dist/swamp-windows-x86_64.zip
            dist/checksums.txt

  github-release:
    name: Publish GitHub Release and trigger UAT
    runs-on: ubuntu-latest
    needs: release
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
    permissions:
      contents: write
    steps:
      - name: Download GitHub Release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-release-assets
          path: dist

      - name: Create GitHub Release
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: swamp ${{ needs.release.outputs.version }}
          target_commitish: ${{ needs.release.outputs.commit }}
          body_path: dist/release_body.md
          fail_on_unmatched_files: true
          files: |
            dist/swamp-linux-x86_64
            dist/swamp-linux-aarch64
            dist/swamp-darwin-x86_64
            dist/swamp-darwin-aarch64
            dist/swamp-windows-x86_64.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger UAT
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.UAT_TRIGGER_TOKEN }}
          repository: swamp-club/swamp-uat
          event-type: run-uat
          client-payload: '{"version": "${{ needs.release.outputs.version }}"}'

  windows-smoke:
    name: Windows Smoke Test
    runs-on: windows-latest
    needs: release
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts/download_release_artifact.sh
          sparse-checkout-cone-mode: false

      - name: Download Windows binary from GCS
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: bash scripts/download_release_artifact.sh "$RELEASE_VERSION" windows/x86_64 .

      - name: Extract and smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path swamp-windows-x86_64.zip -DestinationPath .
          .\swamp.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\swamp.exe --help | Out-Null

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download Linux binaries from GCS
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          bash scripts/download_release_artifact.sh "$RELEASE_VERSION" linux/x86_64 docker-build/linux-amd64
          bash scripts/download_release_artifact.sh "$RELEASE_VERSION" linux/aarch64 docker-build/linux-arm64
          echo "docker_tag=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build date
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Copy Dockerfile into build contexts
        run: |
          cp Dockerfile docker-build/linux-amd64/
          cp Dockerfile docker-build/linux-arm64/

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: docker-build/linux-amd64
          platforms: linux/amd64
          push: true
          tags: swampclub/swamp:${{ env.docker_tag }}-amd64
          build-args: |
            SWAMP_VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.build_date }}
          provenance: mode=max
          sbom: true

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker-build/linux-arm64
          platforms: linux/arm64
          push: true
          tags: swampclub/swamp:${{ env.docker_tag }}-arm64
          build-args: |
            SWAMP_VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.build_date }}
          provenance: mode=max
          sbom: true

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t swampclub/swamp:${{ env.docker_tag }} \
            swampclub/swamp:${{ env.docker_tag }}-amd64 \
            swampclub/swamp:${{ env.docker_tag }}-arm64
