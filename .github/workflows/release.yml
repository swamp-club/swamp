name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Only run on merged PRs (not closed without merge) or manual trigger
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Generate version
        id: version
        run: |
          # Format: YYYYMMDD.HHMMSS.0-sha.COMMITSHA (matches SI convention)
          VERSION=$(date -u +%Y%m%d.%H%M%S).0-sha.$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build dashboard
        working-directory: packages/dashboard
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Linux x86_64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-unknown-linux-gnu \
            --output dist/swamp-linux-x86_64

          # Linux aarch64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target aarch64-unknown-linux-gnu \
            --output dist/swamp-linux-aarch64

          # macOS x86_64
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-apple-darwin \
            --output dist/swamp-darwin-x86_64

          # macOS aarch64 (Apple Silicon)
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target aarch64-apple-darwin \
            --output dist/swamp-darwin-aarch64

          # Windows x86_64 (cross-compiled, packaged as .zip)
          deno run -A scripts/compile.ts \
            --version "$VERSION" \
            --target x86_64-pc-windows-msvc \
            --output /tmp/swamp.exe
          cp /tmp/swamp.exe dist/swamp-windows-x86_64
          (cd /tmp && zip -j "$GITHUB_WORKSPACE/dist/swamp-windows-x86_64.zip" swamp.exe)
          rm /tmp/swamp.exe

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum swamp-* > checksums.txt
          cat checksums.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # Service-account JSON key with object create/read access to the
          # swamp-club-artifacts bucket. Stable promotion runs in swamp-uat.
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Upload versioned artifacts to GCS
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GCS_BUCKET: swamp-club-artifacts
        run: bash scripts/upload_release_artifacts.sh "$RELEASE_VERSION"

      - name: Trigger UAT
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.UAT_TRIGGER_TOKEN }}
          repository: swamp-club/swamp-uat
          event-type: run-uat
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'

  windows-smoke:
    name: Windows Smoke Test
    runs-on: windows-latest
    needs: release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts/download_release_artifact.sh
          sparse-checkout-cone-mode: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Download Windows binary from GCS
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: bash scripts/download_release_artifact.sh "$RELEASE_VERSION" windows/x86_64 .

      - name: Extract and smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path swamp-windows-x86_64.zip -DestinationPath .
          .\swamp.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\swamp.exe --help | Out-Null

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Download Linux binaries from GCS
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          bash scripts/download_release_artifact.sh "$RELEASE_VERSION" linux/x86_64 docker-build/linux-amd64
          bash scripts/download_release_artifact.sh "$RELEASE_VERSION" linux/aarch64 docker-build/linux-arm64
          echo "docker_tag=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build date
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Copy Dockerfile into build contexts
        run: |
          cp Dockerfile docker-build/linux-amd64/
          cp Dockerfile docker-build/linux-arm64/

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: docker-build/linux-amd64
          platforms: linux/amd64
          push: true
          tags: swampclub/swamp:${{ env.docker_tag }}-amd64
          build-args: |
            SWAMP_VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.build_date }}
          provenance: mode=max
          sbom: true

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker-build/linux-arm64
          platforms: linux/arm64
          push: true
          tags: swampclub/swamp:${{ env.docker_tag }}-arm64
          build-args: |
            SWAMP_VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.build_date }}
          provenance: mode=max
          sbom: true

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t swampclub/swamp:${{ env.docker_tag }} \
            swampclub/swamp:${{ env.docker_tag }}-amd64 \
            swampclub/swamp:${{ env.docker_tag }}-arm64
