name: Multi-Model Skill Trigger Eval

on:
  schedule:
    # Run every Saturday at 08:00 UTC
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model aliases to evaluate (or 'all')"
        required: false
        default: "all"

jobs:
  eval:
    name: Eval (${{ matrix.model }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: opus
            concurrency: 20
          - model: sonnet
            concurrency: 20
          - model: gpt-5.4
            concurrency: 1
          - model: gemini-2.5-pro
            concurrency: 20
          - model: gemini-3.1-pro
            concurrency: 20
          - model: fable
            concurrency: 20
    steps:
      - name: Check if model is selected
        id: check
        env:
          MODELS: ${{ github.event.inputs.models || 'all' }}
          MODEL: ${{ matrix.model }}
        run: |
          if [ "$MODELS" = "all" ] || echo ",$MODELS," | grep -q ",$MODEL,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Setup Go
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Build the evaluator
        if: steps.check.outputs.run == 'true'
        run: sh tools/swamp-eval/build.sh

      - name: Run skill evals
        if: steps.check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MODEL: ${{ matrix.model }}
          CONCURRENCY: ${{ matrix.concurrency }}
        run: >-
          ./.bin/swamp-eval run
          --repo-root "$GITHUB_WORKSPACE"
          --model "$MODEL"
          --route api
          --concurrency "$CONCURRENCY"
          --out "$GITHUB_WORKSPACE/eval-results/$MODEL.json"
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload eval results
        if: steps.check.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-results-${{ matrix.model }}
          path: eval-results/${{ matrix.model }}.json
          if-no-files-found: warn
          retention-days: 14

  analysis:
    name: Cross-Model Analysis
    runs-on: ubuntu-latest
    needs: eval
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Download all eval results
        uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: eval-artifacts

      - name: Build the evaluator
        run: sh tools/swamp-eval/build.sh

      - name: Run cross-model analysis
        env:
          MODELS: ${{ github.event.inputs.models || 'all' }}
        run: >-
          ./.bin/swamp-eval report
          "$GITHUB_WORKSPACE/eval-artifacts"
          --expect "$MODELS"
          --github-summary "$GITHUB_STEP_SUMMARY"
