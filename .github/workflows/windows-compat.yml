name: Windows Compatibility

# Scheduled rather than per-merge: a run takes 40-50 minutes, so a push trigger
# stacked several concurrent runs on busy days. Scheduled runs check out the
# head of main.
on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  windows-test:
    name: Windows Lint, Test, and Compile
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Run deno lint
        run: deno lint

      - name: Run deno fmt --check
        run: deno fmt --check

      - name: Run deno check
        run: deno task check

      - name: Run deno test
        run: deno task test

      - name: Build dashboard
        working-directory: packages/dashboard
        run: |
          npm ci
          npm run build

      - name: Compile binary
        run: deno task compile

      - name: Smoke test compiled binary
        shell: bash
        run: |
          ./swamp.exe --version
          ./swamp.exe --help > /dev/null
