# workflows/deploy-and-notify/workflow.yaml
name: deploy-and-notify
description: Deploy then notify team
version: 1
inputs:
  properties:
    environment:
      type: string
      enum: ["dev", "staging", "production"]
  required: ["environment"]
jobs:
  - name: deploy
    description: Deploy the application
    steps:
      - name: run-deploy
        task:
          type: model_method
          modelIdOrName: deploy-service
          methodName: deploy
          inputs:
            environment: ${{ inputs.environment }}

  - name: notify-success
    description: Notify on success
    dependsOn:
      - job: deploy
        condition:
          type: succeeded
    steps:
      - name: send-notification
        task:
          type: workflow
          workflowIdOrName: notify-team
          inputs:
            channel: slack
            message: "Successfully deployed to ${{ inputs.environment }}"

  - name: notify-failure
    description: Notify on failure
    dependsOn:
      - job: deploy
        condition:
          type: failed
    steps:
      - name: send-alert
        task:
          type: workflow
          workflowIdOrName: notify-team
          inputs:
            channel: email
            message: "ALERT: Deployment to ${{ inputs.environment }} failed!"
