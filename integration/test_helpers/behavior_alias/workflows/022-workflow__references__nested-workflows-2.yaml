name: corpus-22
# child — declares episodes as an array input
inputs:
  properties:
    episodes:
      type: array
      items: { type: object }
  required: ["episodes"]

jobs:
  - name: download
    steps:
      - name: download-${{ self.ep.show }}
        forEach:
          item: ep
          in: ${{ inputs.episodes }}
        task:
          type: model_method
          modelIdOrName: transmission
          methodName: add
          inputs:
            uri: ${{ self.ep.magnet }}
            protocol: torrent
