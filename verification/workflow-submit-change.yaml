id: c7841e84-7343-43b9-a537-eb3718f7da44
name: submit-change
description: |
  Submit a change for review: run the build, agent-review and skill
  verifications, then (in later jobs) build and publish the attestation and
  open the PR. Named for the outcome rather than a position in the process —
  attesting and publishing are how a change is submitted with evidence, not
  peers of it.

  The three verification groups keep their verify-build / verify-reviews /
  verify-skills names. They live in this one flat file rather than as nested
  sub-workflows because a nested run produces one attestation per child, and
  the point of consolidating is a single attestation over a single run id.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
    runBuild:
      type: boolean
      default: true
      description: |
        Run the verify-build group (lint, fmt, type check, tests, audit,
        compile, smoke). Set false to re-run a subset; everything downstream
        still runs, so the attestation stays complete.
    runReviews:
      type: boolean
      default: true
      description: Run the verify-reviews group (agent code reviews).
    runSkills:
      type: boolean
      default: true
      description: Run the verify-skills group (skill review, trigger evals).
  required:
    - commit
    - branch

reports:
  require:
    - "@swamp/verification-attestation"

concurrency: 4

# ── Worktrees, model names, and the shared run id ───────────────────────────
#
# The three groups used to be three workflows, so each had a run id of its
# own and could key its worktree and its per-run model definitions on it.
# They now share one run id, so anything that was unique only by accident of
# being in a separate run has to be re-keyed by group as well:
#
#   - Worktrees keep their per-group prefix (swamp-verify-{build,reviews,
#     skills}-<run id>) so the three checkouts never collide.
#   - The `@swamp/git` model is named `repo-reviews-<run id>` and
#     `repo-skills-<run id>`. A step input for a global argument is persisted
#     into the model's stored definition, so one shared `repo-<run id>` would
#     hand the reviews worktree path to the skills diff — a race that the
#     separate runs used to prevent for free.
#
# Every step in a group carries that group's `!inputs.runX` guard. A job whose
# steps all skip still reports `succeeded`, so guarding only the group's setup
# step would leave the rest of the group running against a worktree that was
# never created. The setup step's guard is the group flag *alone*, which is
# what lets a reader tell a deselected group (setup skipped) from a path guard
# correctly excluding one review (setup ran, the review skipped).

jobs:
  # ══ verify-build ═══════════════════════════════════════════════════════════
  - name: build-setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  - name: build-static-analysis
    description: Lint, format check, and type check.
    dependsOn:
      - job: build-setup
        condition:
          type: succeeded
    steps:
      - name: lint
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-lint-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno lint"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: fmt-check
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-fmt-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno fmt --check"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: type-check
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-check-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task check"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  - name: build-tests
    description: Run the full test suite.
    dependsOn:
      - job: build-setup
        condition:
          type: succeeded
    steps:
      - name: run-tests
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-tests-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task test"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  - name: build-deps-audit
    description: Scan dependencies for known vulnerabilities.
    dependsOn:
      - job: build-setup
        condition:
          type: succeeded
    steps:
      - name: vuln-scan
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-audit-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task audit"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  - name: build-compile
    description: Compile the binary and verify it executes.
    dependsOn:
      - job: build-static-analysis
        condition:
          type: succeeded
      - job: build-tests
        condition:
          type: succeeded
    steps:
      - name: build
        guard: "${{ !inputs.runBuild }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-compile-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task compile"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: binary-check
        guard: "${{ !inputs.runBuild }}"
        dependsOn:
          - step: build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-smoke-${{ run.id }}
          methodName: execute
          inputs:
            run: "ls -la swamp && chmod +x swamp && ./swamp --version"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ══ verify-reviews ═════════════════════════════════════════════════════════

  - name: reviews-setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        guard: "${{ !inputs.runReviews }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              git fetch origin main
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"
              swamp repo init "$CHECKOUT_DIR"
              # init prepends a managed section to CLAUDE.md and .gitignore;
              # restore them so only the branch's own changes reach the diff.
              git -C "$CHECKOUT_DIR" checkout -- .

  - name: reviews-detect-changes
    description: Compute the merge-base diff and changed file list.
    dependsOn:
      - job: reviews-setup
        condition:
          type: succeeded
    steps:
      # `repoPath` is required, not decorative. Without it @swamp/git runs in
      # the caller's cwd — the checkout `swamp workflow run` was invoked from,
      # not the verified worktree. That checkout is usually clean and sitting
      # on origin/main, so the diff comes back EMPTY, every path guard below
      # sees zero changed files, and every guarded review silently skips while
      # the workflow reports success.
      #
      # `threeWay` makes this `origin/main...HEAD`, i.e. merge-base relative,
      # matching the `git merge-base` the review steps below compute. Without
      # it the guards filter a two-dot diff against the *moving* origin/main
      # tip, so every commit that lands on main after a branch forks joins the
      # file list — a branch touching only YAML was seen firing the
      # src/-guarded reviews on 34 unrelated files. The guard list and the
      # reviewed diff have to be the same set of changes.
      - name: diff
        guard: "${{ !inputs.runReviews }}"
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo-reviews-${{ run.id }}
          methodName: diff
          inputs:
            repoPath: "/tmp/swamp-verify-reviews-${{ run.id }}"
            base: "origin/main"
            threeWay: true

      - name: changed-files
        guard: "${{ !inputs.runReviews }}"
        dependsOn:
          - step: diff
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo-reviews-${{ run.id }}
          methodName: diff
          inputs:
            repoPath: "/tmp/swamp-verify-reviews-${{ run.id }}"
            base: "origin/main"
            nameOnly: true
            threeWay: true

  - name: reviews
    description: Run all agent reviews in parallel using claude CLI.
    dependsOn:
      - job: reviews-detect-changes
        condition:
          type: succeeded
    steps:
      # The group flag is the FIRST disjunct on every path-guarded review, and
      # that ordering is load-bearing: CEL short-circuits `||`, so a
      # deselected group never reaches the `data.latest` call for a diff its
      # own detect-changes step skipped.
      - name: code-review
        guard: "${{ !inputs.runReviews }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-code-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/code-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "Code review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: adversarial-review
        guard: "${{ !inputs.runReviews || data.latest('repo-reviews-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('src/cli/') || f.startsWith('src/domain/') || f.startsWith('src/infrastructure/') || f.startsWith('src/libswamp/') || f.startsWith('src/serve/') || f.startsWith('src/worker/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-adversarial-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/adversarial-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "Adversarial review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: ux-review
        guard: "${{ !inputs.runReviews || data.latest('repo-reviews-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('src/cli/commands/') || f.startsWith('src/presentation/') || f == 'src/domain/errors.ts' || f.startsWith('src/libswamp/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ux-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/ux-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-sonnet-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "UX review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: ci-security-review
        guard: "${{ !inputs.runReviews || data.latest('repo-reviews-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('.github/workflows/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ci-security-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/ci-security-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "CI security review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

  # ══ verify-skills ══════════════════════════════════════════════════════════

  - name: skills-setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        guard: "${{ !inputs.runSkills }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: skills-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              git fetch origin main
              CHECKOUT_DIR="/tmp/swamp-verify-skills-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"
              swamp repo init "$CHECKOUT_DIR"
              # init prepends a managed section to CLAUDE.md and .gitignore;
              # restore them so only the branch's own changes reach the diff.
              git -C "$CHECKOUT_DIR" checkout -- .

  - name: skills-detect-changes
    description: Compute changed file list for guard expressions.
    dependsOn:
      - job: skills-setup
        condition:
          type: succeeded
    steps:
      # See reviews-detect-changes for why `repoPath`, `threeWay` and the
      # per-run model name are all required rather than decorative.
      - name: changed-files
        guard: "${{ !inputs.runSkills }}"
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo-skills-${{ run.id }}
          methodName: diff
          inputs:
            repoPath: "/tmp/swamp-verify-skills-${{ run.id }}"
            base: "origin/main"
            nameOnly: true
            threeWay: true

  - name: skills
    description: Run skill review and trigger evals, guarded by skill-path changes.
    dependsOn:
      - job: skills-detect-changes
        condition:
          type: succeeded
    steps:
      - name: skill-review
        guard: "${{ !inputs.runSkills || data.latest('repo-skills-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('.claude/skills/') || f == 'CLAUDE.md' || f == 'scripts/review_skills.ts' || f.startsWith('evals/promptfoo/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: skills-review-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task review-skills"
            workingDir: "/tmp/swamp-verify-skills-${{ run.id }}"

      - name: skill-trigger-eval
        guard: "${{ !inputs.runSkills || data.latest('repo-skills-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('.claude/skills/') || f == 'CLAUDE.md' || f == 'scripts/review_skills.ts' || f.startsWith('evals/promptfoo/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: skills-trigger-eval-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task eval-skill-triggers"
            workingDir: "/tmp/swamp-verify-skills-${{ run.id }}"

  # ══ Cleanup ════════════════════════════════════════════════════════════════
  #
  # One cleanup job for all three groups, not one per group. The three used to
  # clean up independently because each had its own run id to scope the
  # `*-<run id>.yaml` auto-definition sweep by; under a shared run id, a
  # per-group cleanup would delete another still-running group's model
  # definitions.

  - name: cleanup
    description: Remove the temporary worktrees and per-run model definitions.
    dependsOn:
      - job: build-compile
        condition:
          type: always
      - job: build-deps-audit
        condition:
          type: always
      - job: reviews
        condition:
          type: always
      - job: skills
        condition:
          type: always
    steps:
      - name: remove-worktrees
        task:
          type: model_method
          modelType: "command/shell"
          modelName: submit-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              for DIR in \
                "/tmp/swamp-verify-build-${{ run.id }}" \
                "/tmp/swamp-verify-reviews-${{ run.id }}" \
                "/tmp/swamp-verify-skills-${{ run.id }}"; do
                git worktree remove --force "$DIR" 2>/dev/null || true
              done
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
            ignoreExitCode: true
