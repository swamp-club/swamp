id: b4d6e8f0-2a1c-4b3d-9e5f-7a8c0d2e4f6b
name: verify-reviews
description: |
  Agent code reviews using claude CLI directly. Detects changed files,
  constructs review prompts with the diff inlined, and runs claude -p
  for each review type in parallel. Runs on the host in a fresh git
  worktree so CLAUDE.md, skills, and file reads reflect the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-setup
          methodName: execute
          inputs:
            run: |
              set -e
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ inputs.commit }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  # ── Detect Changed Files ──────────────────────────────────────
  - name: detect-changes
    description: Compute the merge-base diff and changed file list.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "main"

      - name: changed-files
        dependsOn:
          - step: diff
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "main"
            nameOnly: true

  # ── Agent Reviews ────────────────────────────────────────────
  - name: reviews
    description: Run all agent reviews in parallel using claude CLI.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: code-review
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-code
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base main HEAD)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/code-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n' >> "$PROMPT_FILE"
              git diff "$MERGE_BASE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              rm -f "$PROMPT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$RESULT_FILE"
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::Code review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ inputs.commit }}"

      - name: adversarial-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/domain/') || f.startsWith('src/infrastructure/') || f.startsWith('src/libswamp/') || f.startsWith('src/serve/') || f.startsWith('src/worker/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-adversarial
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base main HEAD)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/adversarial-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n' >> "$PROMPT_FILE"
              git diff "$MERGE_BASE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              rm -f "$PROMPT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$RESULT_FILE"
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::Adversarial review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ inputs.commit }}"

      - name: ux-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/cli/commands/') || f.startsWith('src/presentation/') || f == 'src/domain/errors.ts' || f.startsWith('src/libswamp/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ux
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base main HEAD)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/ux-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n' >> "$PROMPT_FILE"
              git diff "$MERGE_BASE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-sonnet-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              rm -f "$PROMPT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$RESULT_FILE"
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::UX review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ inputs.commit }}"

      - name: ci-security-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('.github/workflows/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ci-security
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base main HEAD)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/ci-security-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n' >> "$PROMPT_FILE"
              git diff "$MERGE_BASE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              rm -f "$PROMPT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$RESULT_FILE"
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::CI security review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ inputs.commit }}"

  # ── Cleanup ──────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: reviews
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-cleanup
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ inputs.commit }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
            ignoreExitCode: true
