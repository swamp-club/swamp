id: b4d6e8f0-2a1c-4b3d-9e5f-7a8c0d2e4f6b
name: verify-reviews
description: |
  Agent code reviews using claude CLI directly. Detects changed files,
  constructs review prompts with the diff inlined, and runs claude -p
  for each review type in parallel. Runs on the host (not in a container)
  so CLAUDE.md and skills are available as project context.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Detect Changed Files ──────────────────────────────────────
  - name: detect-changes
    description: Compute the diff and changed file list.
    steps:
      - name: diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "main"

  # ── Agent Reviews (factory pattern) ──────────────────────────
  - name: reviews
    description: Run all agent reviews in parallel using claude CLI.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: code-review
        task:
          type: model_method
          modelType: "command/shell"
          modelName: cli-reviewer
          methodName: execute
          inputs:
            run: |
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/code-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n%s' "$(git diff main)" >> "$PROMPT_FILE"
              claude -p "$(cat "$PROMPT_FILE")" \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$PROMPT_FILE"
              if [ "$VERDICT" = "fail" ]; then
                echo "::error::Code review found blocking issues"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              rm -f "$RESULT_FILE"

      - name: adversarial-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/domain/') || f.startsWith('src/infrastructure/') || f.startsWith('src/libswamp/') || f.startsWith('src/serve/') || f.startsWith('src/worker/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: cli-reviewer
          methodName: execute
          inputs:
            run: |
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/adversarial-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n%s' "$(git diff main)" >> "$PROMPT_FILE"
              claude -p "$(cat "$PROMPT_FILE")" \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$PROMPT_FILE"
              if [ "$VERDICT" = "fail" ]; then
                echo "::error::Adversarial review found blocking issues"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              rm -f "$RESULT_FILE"

      - name: ux-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/cli/') || f.startsWith('src/presentation/') || f == 'src/domain/errors.ts' || f.startsWith('src/libswamp/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: cli-reviewer
          methodName: execute
          inputs:
            run: |
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/ux-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n%s' "$(git diff main)" >> "$PROMPT_FILE"
              claude -p "$(cat "$PROMPT_FILE")" \
                --model claude-sonnet-4-6 \
                --allowedTools "Read,Glob,Grep" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$PROMPT_FILE"
              if [ "$VERDICT" = "fail" ]; then
                echo "::error::UX review found blocking issues"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              rm -f "$RESULT_FILE"

      - name: ci-security-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('.github/workflows/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: cli-reviewer
          methodName: execute
          inputs:
            run: |
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              cat verification/review-prompts/ci-security-review.md > "$PROMPT_FILE"
              printf '\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n\nDIFF:\n%s' "$(git diff main)" >> "$PROMPT_FILE"
              claude -p "$(cat "$PROMPT_FILE")" \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              rm -f "$PROMPT_FILE"
              if [ "$VERDICT" = "fail" ]; then
                echo "::error::CI security review found blocking issues"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              rm -f "$RESULT_FILE"
