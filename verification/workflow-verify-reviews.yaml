id: b4d6e8f0-2a1c-4b3d-9e5f-7a8c0d2e4f6b
name: verify-reviews
description: |
  Agent code reviews using claude CLI directly. Detects changed files,
  constructs review prompts with the diff inlined, and runs claude -p
  for each review type in parallel. Runs on the host in a fresh git
  worktree so CLAUDE.md, skills, and file reads reflect the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              # Concurrent verifications share refs/remotes/origin/main; the
              # loser of the ref update fails with "incorrect old value".
              # The retry finds the ref current, so it has nothing to write.
              git fetch origin main || { sleep 1; git fetch origin main; }
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"
              swamp repo init "$CHECKOUT_DIR"
              # init prepends a managed section to CLAUDE.md and .gitignore;
              # restore them so only the branch's own changes reach the diff.
              git -C "$CHECKOUT_DIR" checkout -- .

  # ── Detect Changed Files ──────────────────────────────────────
  - name: detect-changes
    description: Compute the merge-base diff and changed file list.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      # `repoPath` is required, not decorative. Without it @swamp/git runs in
      # the caller's cwd — the checkout `swamp workflow run` was invoked from,
      # not the verified worktree. That checkout is usually clean and sitting
      # on origin/main, so the diff comes back EMPTY, every path guard below
      # sees zero changed files, and every guarded review silently skips while
      # the workflow reports success.
      #
      # The model is named per-run for the same reason the shell models are:
      # a step input for a global argument is persisted into the model's
      # stored definition, so a single shared `repo` model would hand one
      # run's worktree path to the next, and two concurrent verifications
      # would race on it — defeating the run-id-keyed worktrees. The cleanup
      # job deletes these `*-<run.id>.yaml` definitions afterwards.
      #
      # `threeWay` makes this `origin/main...HEAD`, i.e. merge-base relative,
      # matching the `git merge-base` the review steps below compute. Without
      # it the guards filter a two-dot diff against the *moving* origin/main
      # tip, so every commit that lands on main after a branch forks joins the
      # file list — a branch touching only YAML was seen firing the
      # src/-guarded reviews on 34 unrelated files. The guard list and the
      # reviewed diff have to be the same set of changes.
      - name: diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo-${{ run.id }}
          methodName: diff
          inputs:
            repoPath: "/tmp/swamp-verify-reviews-${{ run.id }}"
            base: "origin/main"
            threeWay: true

      - name: changed-files
        dependsOn:
          - step: diff
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo-${{ run.id }}
          methodName: diff
          inputs:
            repoPath: "/tmp/swamp-verify-reviews-${{ run.id }}"
            base: "origin/main"
            nameOnly: true
            threeWay: true

  # ── Agent Reviews ────────────────────────────────────────────
  - name: reviews
    description: Run all agent reviews in parallel using claude CLI.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: code-review
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-code-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/code-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-5-5 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "Code review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: adversarial-review
        guard: "${{ data.latest('repo-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('src/cli/') || f.startsWith('src/domain/') || f.startsWith('src/infrastructure/') || f.startsWith('src/libswamp/') || f.startsWith('src/serve/') || f.startsWith('src/worker/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-adversarial-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/adversarial-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-5-5 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "Adversarial review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: ux-review
        guard: "${{ data.latest('repo-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('src/cli/commands/') || f.startsWith('src/presentation/') || f == 'src/domain/errors.ts' || f.startsWith('src/libswamp/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ux-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/ux-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-5-5 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "UX review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: ci-security-review
        guard: "${{ data.latest('repo-' + run.id, 'diff').attributes.files.filter(f, f.startsWith('.github/workflows/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ci-security-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/ci-security-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nIMPORTANT: You MUST begin your response with exactly one of these two lines:\nVERDICT: pass\nVERDICT: fail\n\nThen provide your full review below the verdict line.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-5-5 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              CLAUDE_EXIT=$?
              rm -f "$PROMPT_FILE" "$DIFF_FILE"
              if [ $CLAUDE_EXIT -ne 0 ]; then
                echo "::error::claude exited with status $CLAUDE_EXIT"
                rm -f "$RESULT_FILE"
                exit 1
              fi
              deno run --allow-read="$RESULT_FILE" \
                scripts/check_review_verdict.ts "$RESULT_FILE" "CI security review"
              VERDICT_EXIT=$?
              rm -f "$RESULT_FILE"
              exit $VERDICT_EXIT
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

  # ── Cleanup ──────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: reviews
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ run.id }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
            ignoreExitCode: true
