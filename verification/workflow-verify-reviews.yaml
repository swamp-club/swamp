id: b4d6e8f0-2a1c-4b3d-9e5f-7a8c0d2e4f6b
name: verify-reviews
description: |
  Agent code reviews: detect changed files, then run code review, adversarial
  review, UX review, and CI security review in parallel. Runs in the review
  container with ANTHROPIC_API_KEY.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
    agentCliVersion:
      type: string
      description: Claude Code CLI version for agent reviews.
      default: "2.1.240"
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Detect Changed Files ──────────────────────────────────────
  - name: detect-changes
    description: Compute the list of files changed on this branch.
    steps:
      - name: diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "main"

  # ── Agent Reviews (factory pattern) ──────────────────────────
  - name: reviews
    description: Run all agent reviews in parallel using a single model.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: code-review
        task:
          type: model_method
          modelType: "@swamp/agent-runner"
          modelName: reviewer
          methodName: review
          globalArgs:
            version: "${{ inputs.agentCliVersion }}"
            apiKeyEnvVar: "ANTHROPIC_API_KEY"
          inputs:
            instanceName: code-review
            promptFile: "verification/review-prompts/code-review.md"
            model: "claude-opus-4-6"
            diff: "${{ data.latest('repo', 'diff').attributes.raw }}"
            readOnly: true

      - name: adversarial-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/domain/') || f.startsWith('src/infrastructure/') || f.startsWith('src/libswamp/') || f.startsWith('src/serve/') || f.startsWith('src/worker/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "@swamp/agent-runner"
          modelName: reviewer
          methodName: review
          globalArgs:
            version: "${{ inputs.agentCliVersion }}"
            apiKeyEnvVar: "ANTHROPIC_API_KEY"
          inputs:
            instanceName: adversarial
            promptFile: "verification/review-prompts/adversarial-review.md"
            model: "claude-opus-4-6"
            diff: "${{ data.latest('repo', 'diff').attributes.raw }}"
            readOnly: true

      - name: ux-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('src/cli/') || f.startsWith('src/presentation/') || f == 'src/domain/errors.ts' || f.startsWith('src/libswamp/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "@swamp/agent-runner"
          modelName: reviewer
          methodName: review
          globalArgs:
            version: "${{ inputs.agentCliVersion }}"
            apiKeyEnvVar: "ANTHROPIC_API_KEY"
          inputs:
            instanceName: ux
            promptFile: "verification/review-prompts/ux-review.md"
            model: "claude-sonnet-4-6"
            diff: "${{ data.latest('repo', 'diff').attributes.raw }}"
            readOnly: true

      - name: ci-security-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('.github/workflows/')).size() == 0 }}"
        task:
          type: model_method
          modelType: "@swamp/agent-runner"
          modelName: reviewer
          methodName: review
          globalArgs:
            version: "${{ inputs.agentCliVersion }}"
            apiKeyEnvVar: "ANTHROPIC_API_KEY"
          inputs:
            instanceName: ci-security
            promptFile: "verification/review-prompts/ci-security-review.md"
            model: "claude-opus-4-6"
            diff: "${{ data.latest('repo', 'diff').attributes.raw }}"
            readOnly: true
