id: 7c2f8a31-4e19-4d6b-b8a0-1f3d5e7c9b2a
name: verify-build
description: |
  Build verification: lint, format check, type check, tests, dependency audit,
  compile, and binary smoke test. Runs on the host from a fresh checkout.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Static Analysis ──────────────────────────────────────────
  - name: static-analysis
    description: Lint, format check, and type check.
    steps:
      - name: lint
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-lint
          methodName: execute
          inputs:
            run: "deno lint"

      - name: fmt-check
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-fmt
          methodName: execute
          inputs:
            run: "deno fmt --check"

      - name: type-check
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-check
          methodName: execute
          inputs:
            run: "deno task check"

  # ── Tests ────────────────────────────────────────────────────
  - name: tests
    description: Run the full test suite.
    steps:
      - name: run-tests
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-tests
          methodName: execute
          inputs:
            run: "deno task test"

  # ── Dependency Audit ─────────────────────────────────────────
  - name: deps-audit
    description: Scan dependencies for known vulnerabilities.
    steps:
      - name: vuln-scan
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-audit
          methodName: execute
          inputs:
            run: "deno task audit"

  # ── Compile + Binary Check ────────────────────────────────────
  - name: compile
    description: Compile the binary and verify it executes.
    dependsOn:
      - job: static-analysis
        condition:
          type: succeeded
      - job: tests
        condition:
          type: succeeded
    steps:
      - name: build
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-compile
          methodName: execute
          inputs:
            run: "deno task compile"

      - name: binary-check
        dependsOn:
          - step: build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-smoke
          methodName: execute
          inputs:
            run: "ls -la swamp && chmod +x swamp && ./swamp --version"
