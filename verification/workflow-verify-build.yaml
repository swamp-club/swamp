id: 7c2f8a31-4e19-4d6b-b8a0-1f3d5e7c9b2a
name: verify-build
description: |
  Build verification: lint, format check, type check, tests, dependency audit,
  compile, and binary smoke test. Runs on the host in a fresh git worktree
  checked out at the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  # ── Static Analysis ──────────────────────────────────────────
  - name: static-analysis
    description: Lint, format check, and type check.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: lint
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-lint-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno lint"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: fmt-check
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-fmt-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno fmt --check"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: type-check
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-check-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task check"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Tests ────────────────────────────────────────────────────
  - name: tests
    description: Run the full test suite.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: run-tests
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-tests-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task test"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Dependency Audit ─────────────────────────────────────────
  - name: deps-audit
    description: Scan dependencies for known vulnerabilities.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: vuln-scan
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-audit-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task audit"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Compile + Binary Check ────────────────────────────────────
  - name: compile
    description: Compile the binary and verify it executes.
    dependsOn:
      - job: static-analysis
        condition:
          type: succeeded
      - job: tests
        condition:
          type: succeeded
    steps:
      - name: build
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-compile-${{ run.id }}
          methodName: execute
          inputs:
            run: "deno task compile"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: binary-check
        dependsOn:
          - step: build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-smoke-${{ run.id }}
          methodName: execute
          inputs:
            run: "ls -la swamp && chmod +x swamp && ./swamp --version"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Cleanup ──────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: compile
        condition:
          type: always
      - job: deps-audit
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
            ignoreExitCode: true
