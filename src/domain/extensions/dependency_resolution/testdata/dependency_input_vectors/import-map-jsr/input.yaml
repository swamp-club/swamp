description: "A bare name mapped to a jsr: package, with a subpath key."
files:
  "deno.json": |
    {
      "imports": {
        "@vec/lib": "jsr:@vec/lib@1.0.0"
      }
    }
  "extensions/models/m.ts": |
    import { lib } from "@vec/lib";

    export const model = [lib];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
