description: "A package.json above the repository that declares a bare import, with no project inside the repository."
repo: repo
files:
  "package.json": |
    {
      "dependencies": {
        "vecpkg": "^1.0.0"
      }
    }
  "repo/extensions/models/m.ts": |
    import value from "vecpkg";

    export const model = [value];
  "repo/manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
installed:
  - dir: node_modules/vecpkg
    name: vecpkg
    version: "1.0.0"
