description: "A bare name mapped to an npm: range with no lock: it ships pinned, and the loose point is lost."
files:
  "deno.json": |
    {
      "imports": {
        "vecpkg": "npm:vecpkg@^1"
      }
    }
  "extensions/models/m.ts": |
    import value from "vecpkg";

    export const model = [value];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
