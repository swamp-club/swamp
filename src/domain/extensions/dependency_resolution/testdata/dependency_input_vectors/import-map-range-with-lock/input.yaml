description: "A bare name mapped to an npm: range a deno.lock resolves."
files:
  "deno.json": |
    {
      "imports": {
        "vecpkg": "npm:vecpkg@^1"
      }
    }
  "deno.lock": |
    {
      "version": "5",
      "specifiers": {
        "npm:vecpkg@1": "1.0.0"
      },
      "npm": {
        "vecpkg@1.0.0": {
          "integrity": "{{INTEGRITY vecpkg@1.0.0}}",
          "tarball": "{{ORIGIN}}/vecpkg/-/vecpkg-1.0.0.tgz"
        }
      },
      "workspace": {
        "dependencies": [
          "npm:vecpkg@1"
        ]
      }
    }
  "extensions/models/m.ts": |
    import value from "vecpkg";

    export const model = [value];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
