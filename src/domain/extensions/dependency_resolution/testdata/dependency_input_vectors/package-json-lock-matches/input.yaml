description: "A package.json range with a package-lock.json that node_modules matches: a valid lock, so no loose point is lost."
files:
  "extensions/models/m.ts": |
    import value from "vecpkg";

    export const model = [value];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
  "package.json": |
    {
      "dependencies": {
        "vecpkg": "^1.0.0"
      }
    }
  "package-lock.json": |
    {
      "name": "v",
      "lockfileVersion": 3,
      "requires": true,
      "packages": {
        "": { "dependencies": { "vecpkg": "^1.0.0" } },
        "node_modules/vecpkg": { "version": "1.0.0" }
      }
    }
installed:
  - dir: node_modules/vecpkg
    name: vecpkg
    version: "1.0.0"
