description: "A written npm: range in a type-only import, a side-effect import and re-exports: every site ships pinned."
files:
  "extensions/models/m.ts": |
    import type * as T from "npm:vecpkg@^1";
    import "npm:vecpkg@^1";
    export { default as value } from "npm:vecpkg@^1";
    export * from "npm:vecpkg@^1";

    export type V = typeof T;
    export const model = [];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
