description: "A deno.json above the repository beside written npm: imports only."
repo: repo
files:
  "deno.json": |
    {
      "imports": {
        "vecpkg": "npm:vecpkg@1.1.0"
      }
    }
  "repo/extensions/models/m.ts": |
    import value from "npm:vecpkg@1.0.0";

    export const model = [value];
  "repo/manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
