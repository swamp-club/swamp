description: "A side-effect import of a bare name beside a package.json."
files:
  "extensions/models/m.ts": |
    import "vecpkg";

    export const model = [];
  "manifest.yaml": |
    manifestVersion: 1
    name: "@vectors/v"
    version: "2026.10.26.1"
    description: "dependency input vector"
    models:
      - m.ts
  "package.json": |
    {
      "dependencies": {
        "vecpkg": "^1.0.0"
      }
    }
installed:
  - dir: node_modules/vecpkg
    name: vecpkg
    version: "1.0.0"
